<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Updates</title>
<style>
:root{
      --bg:#F5F7FA;
      --card:#FFFFFF;
      --text:#111827;
      --muted:#667085;
      --border:#E5E7EB;
      --blue:#2563EB;
      --blue-soft:#EFF6FF;
      --blue-border:#D7E5FF;
      --green:#16A34A;
      --orange:#F59E0B;
      --purple:#8B5CF6;
    }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
.container{width:min(1140px,calc(100% - 36px));margin:0 auto;padding:34px 0 60px}
.header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20pxbackground:linear-gradient(180deg,#FFFFFF 0%,#F8FAFC 100%);}
.brand h1{margin:0;font-size:29px;line-height:1.1;letter-spacing:-.7px;font-weight:800}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.header-right{display:flex;align-items:center;gap:16px}
.last-updated{font-size:11px;color:var(--muted);text-align:right}
.last-updated strong{display:block;color:#344054;font-size:12px;margin-top:2px}
.refresh{border:0;background:var(--primary);color:#fff;padding:10px 15px;border-radius:8px;font-size:12px;font-weight:750}
.refresh:hover{background:#1d4ed8}.refresh:disabled{opacity:.6;cursor:wait}
.search-row{display:block;margin-bottom:14px}
.search{width:100%;height:43px;padding:0 13px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);outline:none}
.search::placeholder{color:#98a2b3}.search:focus{border-color:#9ab8f7;box-shadow:0 0 0 3px #e9f0ff}
.select{height:36px;min-width:0;flex:1;width:100%;border:1px solid var(--border);border-radius:7px;background:var(--card);padding:0 8px;color:#344054;outline:none;font-size:11px}
.filter-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:15px;overflow:hidden}
.filter-main{margin:0}
.filter-main>summary{list-style:none;cursor:pointer;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;user-select:none}
.filter-main>summary::-webkit-details-marker{display:none}
.filter-main>summary:hover{background:#F8FAFC}
.filter-main-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#344054}
.filter-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:#eef4ff;color:var(--blue);font-size:14px}

.filter-reset-top{
  border:0;background:transparent;color:var(--blue);font-size:10px;font-weight:800;
  padding:2px 4px;margin-left:auto;cursor:pointer
}
.filter-reset-top:hover{text-decoration:underline}
.filter-footer{
  padding:9px 15px;border-top:1px solid #eef1f5;
  display:flex;justify-content:flex-end;background:#F8FAFC
}
.filter-reset{
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  border-radius:7px;padding:6px 10px;font-size:10px;font-weight:750
}
.filter-reset:hover{border-color:#b9c4d4;color:#344054}
.filter-main-current{background:#f1f4f8;color:var(--muted);border-radius:999px;padding:3px 8px;font-size:9px;font-weight:800}
.filter-chevron{font-size:16px;color:#98a2b3;transition:transform .15s ease}
.filter-main[open] .filter-chevron{transform:rotate(180deg)}
.filter-main-content{border-top:1px solid #eef1f5}
.filter-accordion{border-bottom:1px solid #eef1f5}
.filter-accordion:last-child{border-bottom:0}
.filter-accordion summary{list-style:none;cursor:pointer;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--muted);user-select:none}
.filter-accordion summary::-webkit-details-marker{display:none}
.filter-accordion summary::after{content:"⌄";font-size:14px;line-height:1;color:#98a2b3;transition:transform .15s ease}
.filter-accordion[open] summary::after{transform:rotate(180deg)}
.filter-accordion summary:hover{background:#F8FAFC}
.accordion-title{display:flex;align-items:center;gap:8px}
.accordion-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 6px;border-radius:999px;background:#f1f4f8;color:var(--muted);font-size:9px;letter-spacing:0;text-transform:none;font-weight:800}
.filter-accordion[open] .accordion-count{background:#eef4ff;color:var(--blue)}
.filter-content{padding:0 15px 12px}
.filter-row{display:flex;flex-wrap:wrap;gap:5px}
.filter{border:1px solid var(--border);background:var(--card);color:#475467;padding:6px 10px;border-radius:7px;font-size:11px;font-weight:650}
.filter:hover{border-color:#c2ccda}
.filter.active{background:var(--primary);border-color:var(--primary);color:#fff}
.display-inline{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.display-control{display:flex;align-items:center;gap:7px}
.display-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:#98a2b3;flex:0 0 auto}

.filters{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  margin-bottom:15px;overflow:hidden
}
.filter-accordion{border-bottom:1px solid #eef1f5}
.filter-accordion:last-child{border-bottom:0}
.filter-accordion summary{
  list-style:none;cursor:pointer;padding:12px 15px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;font-size:11px;text-transform:uppercase;
  letter-spacing:.07em;font-weight:800;color:var(--muted);user-select:none
}
.filter-accordion summary::-webkit-details-marker{display:none}
.filter-accordion summary::after{
  content:"⌄";font-size:15px;line-height:1;color:#98a2b3;
  transition:transform .15s ease
}
.filter-accordion[open] summary::after{transform:rotate(180deg)}
.filter-accordion summary:hover{background:#F8FAFC}
.accordion-title{display:flex;align-items:center;gap:8px}
.accordion-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:19px;padding:0 6px;border-radius:999px;
  background:#f1f4f8;color:var(--muted);font-size:9px;letter-spacing:0;
  text-transform:none;font-weight:800
}
.filter-accordion[open] .accordion-count{background:#eef4ff;color:var(--blue)}
.filter-content{padding:0 15px 13px}
.filter-row{display:flex;flex-wrap:wrap;gap:5px}
.filter{
  border:1px solid var(--border);background:var(--card);color:#475467;
  padding:6px 10px;border-radius:7px;font-size:11px;font-weight:650
}
.filter:hover{border-color:#c2ccda}
.filter.active{background:var(--primary);border-color:var(--primary);color:#fff}

.meta-row{display:flex;align-items:center;justify-content:space-between;margin:0 0 7px}
.stats{display:flex;gap:6px;flex-wrap:wrap}.stat{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:11px;color:var(--muted)}.stat strong{color:var(--text);font-weight:800}
.source-summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.source-chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:10px;color:#52627a;font-weight:650}
.source-chip strong{color:var(--text)}
.source-code{display:inline-flex;align-items:center;justify-content:center;width:22px;height:20px;border-radius:6px;color:#fff;font-size:9px;font-weight:800}
#articles{display:grid;gap:7px}
.article-card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px 15px 12px}
.article-card:hover{border-color:#d4dce8;box-shadow:0 3px 12px rgba(16,24,40,.04)}
.article-card.latest{
  border-color:#cbdaf8;
  box-shadow:0 2px 12px rgba(37,99,235,.06);
}
.article-card.latest .title{font-size:16px}
.latest-label{
  display:inline-flex;align-items:center;
  background:var(--primary-soft);color:#315da8;
  border-radius:999px;padding:2px 7px;
  font-size:9px;font-weight:800;
}
.article-top{display:flex;align-items:center;flex-wrap:wrap;gap:5px;color:var(--muted);font-size:10px;margin-bottom:5px}
.source-name{font-weight:800;color:#52627a}.dot{color:#b8c0cc}
.title{margin:0 0 4px;font-size:15px;line-height:1.32;letter-spacing:-.12px;font-weight:750}.title a{text-decoration:none}.title a:hover{color:var(--primary)}
.description{margin:0;color:var(--muted);font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{background:var(--primary-soft);color:#315da8;border:1px solid #e0eaff;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:750}
.read{flex:0 0 auto;color:var(--primary);text-decoration:none;font-size:11px;font-weight:800}.read:hover{text-decoration:underline}
.empty{background:var(--card);border:1px dashed #d3d9e3;border-radius:9px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty-title{font-size:14px;font-weight:800;color:#344054}
.empty-text{font-size:12px;color:var(--muted);margin:4px 0 12px}
.empty-reset{display:inline-block}

.loading{text-align:center;color:var(--muted);padding:40px}
@media(max-width:760px){
  .filter-main>summary{padding:11px 13px}.filter-accordion summary{padding:11px 13px}.filter-content{padding:0 13px 12px}
  .container{width:min(100% - 28px,1140px);padding:24px 0 44px}.header{align-items:flex-start}.brand h1{font-size:25px}
  .header-right{align-items:flex-end}.search-row{grid-template-columns:minmax(0,1fr) 105px}.search-row .select:last-child{grid-column:2}
  .filter-group{display:block}.filter-label{padding:0;margin-bottom:6px}.filter-group+.filter-group{margin-top:10px;padding-top:10px}
}
@media(max-width:500px){
  .header{flex-direction:row;align-items:center;gap:12px}.header-right{width:auto}.refresh{width:auto;padding:9px 12px}
  .display-inline{grid-template-columns:1fr 1fr}.card-bottom{align-items:flex-start;flex-direction:column}.read{align-self:flex-end}
}
</style>
</head>
<body>
<main class="container">
  <header class="header">
    <div class="brand">
      <h1>SEO Updates</h1>
      <p>SEO, Google, AI Search &amp; Technical</p>
    </div>
    <div class="header-right"><button class="refresh" id="refreshBtn">↻ Refresh</button>
    </div>
  </header>

  <section class="search-row">
    <div class="search-wrap">
      <input class="search" id="searchInput" type="search" placeholder="Cari artikel..." aria-label="Cari artikel">
    </div></div>
  </section>

  <section class="filter-panel">
    <details class="filter-main">
      <summary>
        <span class="filter-main-title">
          <span class="filter-icon">☷</span>
          Filter
          <span class="filter-main-current" id="filterSummary">All</span>
          <button type="button" class="filter-reset-top" id="resetFilters">Reset</button>
        </span>
        <span class="filter-chevron">⌄</span>
      </summary>

      <div class="filter-main-content">
        <details class="filter-accordion">
          <summary>
            <span class="accordion-title">Topic <span class="accordion-count" id="topicCount">All</span></span>
          </summary>
          <div class="filter-content">
            <div class="filter-row" id="topicFilters">
              <button class="filter active" data-value="All">All</button>
              <button class="filter" data-value="Google">Google</button>
              <button class="filter" data-value="SEO">SEO</button>
              <button class="filter" data-value="AI Search">AI Search</button>
              <button class="filter" data-value="Technical">Technical</button>
            </div>
          </div>
        </details>

        <details class="filter-accordion">
          <summary>
            <span class="accordion-title">Source <span class="accordion-count" id="sourceCount">All</span></span>
          </summary>
          <div class="filter-content">
            <div class="filter-row" id="sourceFilters">
              <button class="filter active" data-value="All">All Sources</button>
              <button class="filter" data-value="Search Engine Journal">SEJ</button>
              <button class="filter" data-value="Google Search Central">GSC</button>
              <button class="filter" data-value="Search Engine Roundtable">SER</button>
              <button class="filter" data-value="Search Engine Land">SEL</button>
            </div>
          </div>
        </details>

        <details class="filter-accordion">
          <summary>
            <span class="accordion-title">Time <span class="accordion-count" id="timeCount">All</span></span>
          </summary>
          <div class="filter-content">
            <div class="filter-row" id="timeFilters">
              <button class="filter active" data-value="all">All</button>
              <button class="filter" data-value="24h">24 Hours</button>
              <button class="filter" data-value="7d">7 Days</button>
              <button class="filter" data-value="30d">30 Days</button>
            </div>
          </div>
        </details>

        <details class="filter-accordion">
          <summary>
            <span class="accordion-title">Display <span class="accordion-count" id="displayCount">Terbaru · 50</span></span>
          </summary>
          <div class="filter-content display-inline">
            <div class="display-control">
              <span class="display-label">Urutkan</span>
              <select class="select" id="sortSelect" aria-label="Urutan">
                <option value="newest">Terbaru</option>
                <option value="oldest">Terlama</option>
              </select>
            </div>
            <div class="display-control">
              <span class="display-label">Jumlah</span>
              <select class="select" id="limitSelect" aria-label="Jumlah artikel">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
              </select>
            </div>
          </div>
        </details>
      </div>
      <div class="filter-footer">
        <button type="button" class="filter-reset" id="resetFiltersBottom">Reset filters</button>
      </div>
    </details>
  </section>

  <div class="meta-row">
    <div class="stats" id="stats"></div>
  </div>
  <div class="source-summary" id="sourceSummary"></div>
  <section id="articles"><div class="loading">Memuat artikel...</div></section>
</main>

<script>
(() => {
  const DATA_URL = "data.json";
  let data = {updatedAt:null,items:[]};
  let topic = "All", source = "All", timeRange = "all";

  const sourceMeta = {
    "Search Engine Journal": ["SEJ","#16a34a"],
    "Search Engine Land": ["SEL","#2563eb"],
    "Search Engine Roundtable": ["SER","#f59e0b"],
    "Google Search Central": ["GSC","#8b5cf6"]
  };

  const $ = id => document.getElementById(id);

  function escapeHtml(v){
    return String(v ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function dateObj(v){
    const d = new Date(v);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function formatDate(v){
    const d = dateObj(v);
    if(!d) return "";
    return d.toLocaleString("id-ID", {
      day:"2-digit", month:"short", year:"numeric",
      hour:"2-digit", minute:"2-digit"
    });
  }

  function relativeTime(v){
    const d = dateObj(v);
    if(!d) return "";
    const mins = Math.max(0, Math.floor((Date.now()-d.getTime())/60000));
    if(mins < 1) return "baru saja";
    if(mins < 60) return `${mins} menit lalu`;
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return `${hrs} jam lalu`;
    const days = Math.floor(hrs/24);
    if(days < 30) return `${days} hari lalu`;
    return formatDate(v);
  }

  function matches(item){
    const q = $("searchInput").value.trim().toLowerCase();
    const tags = Array.isArray(item.tags) ? item.tags : [];
    const hay = `${item.title||""} ${item.description||""} ${item.source||""} ${tags.join(" ")}`.toLowerCase();

    if(q && !hay.includes(q)) return false;
    if(topic !== "All" && !tags.includes(topic)) return false;
    if(source !== "All" && item.source !== source) return false;

    if(timeRange !== "all"){
      const d = dateObj(item.date);
      if(!d) return false;
      const limit = { "24h":86400000, "7d":604800000, "30d":2592000000 }[timeRange];
      if(Date.now()-d.getTime() > limit) return false;
    }
    return true;
  }

  function render(){
    let items = (data.items || []).filter(matches);
    items.sort((a,b) => {
      const da = dateObj(a.date)?.getTime() || 0;
      const db = dateObj(b.date)?.getTime() || 0;
      return $("sortSelect").value === "oldest" ? da-db : db-da;
    });

    const total = items.length;

    const updated = data.updatedAt ? formatDate(data.updatedAt) : "Belum tersedia";
    const updatedTime = data.updatedAt
      ? (dateObj(data.updatedAt)?.toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"}) || "")
      : "";
    $("stats").innerHTML =
      `<div class="stat"><strong>${total}</strong> artikel</div>
       <div class="stat">Update <strong>${escapeHtml(updatedTime)}</strong></div>`;

    const allCounts = {};
    items.forEach(i => allCounts[i.source] = (allCounts[i.source]||0)+1);

    $("sourceSummary").innerHTML = Object.entries(allCounts).map(([n,c]) => {
      const meta = sourceMeta[n] || ["SRC","#64748b"];
      return `<span class="source-chip" title="${escapeHtml(n)}"><span class="source-code" style="background:${meta[1]}">${meta[0]}</span><strong>· ${c}</strong></span>`;
    }).join("");

    items = items.slice(0, Number($("limitSelect").value));

    if(!items.length){
      $("articles").innerHTML = `
        <div class="empty">
          <div class="empty-title">No articles found</div>
          <div class="empty-text">Coba ubah filter atau reset semua filter.</div>
          <button type="button" class="filter-reset empty-reset" id="emptyReset">Reset filters</button>
        </div>`;
      $("emptyReset").addEventListener("click", resetFilters);
      return;
    }

    $("articles").innerHTML = items.map((item, index) => {
      const link = escapeHtml(item.link || "#");
      const tags = (item.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      const isLatest = index === 0 && $("sortSelect").value === "newest";
      return `
        <article class="article-card${isLatest ? " latest" : ""}">
          <div class="article-top">
            <span class="source-name">${escapeHtml((sourceMeta[item.source] || ["SRC"])[0])}</span>
            <span class="dot">•</span>
            <span>${escapeHtml(relativeTime(item.date))}</span>
            ${isLatest ? '<span class="latest-label">Latest</span>' : ''}
          </div>
          <h2 class="title">
            <a href="${link}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || "Untitled")}</a>
          </h2>
          ${item.description ? `<p class="description">${escapeHtml(item.description)}</p>` : ""}
          <div class="card-bottom">
            <div class="tags">${tags}</div>
            <a class="read" href="${link}" target="_blank" rel="noopener noreferrer">Read article →</a>
          </div>
        </article>`;
    }).join("");
  }

  function bindFilter(groupId, setter, countId, labels){
    document.querySelectorAll(`#${groupId} .filter`).forEach(btn => {
      btn.addEventListener("click", () => {
        const value = btn.dataset.value;
        setter(value);
        document.querySelectorAll(`#${groupId} .filter`).forEach(b =>
          b.classList.toggle("active", b === btn)
        );
        $(countId).textContent = labels[value] || value;
        updateFilterSummary();
        render();
      });
    });
  }

  function resetFilters(){
    topic = "All";
    source = "All";
    timeRange = "all";
    $("sortSelect").value = "newest";
    $("limitSelect").value = "50";

    const groups = [
      ["topicFilters","All","topicCount"],
      ["sourceFilters","All Sources","sourceCount"],
      ["timeFilters","all","timeCount"]
    ];
    groups.forEach(([id, value, countId]) => {
      document.querySelectorAll(`#${id} .filter`).forEach(b =>
        b.classList.toggle("active", b.dataset.value === value)
      );
      $(countId).textContent = value;
    });

    updateDisplayLabel();
    updateFilterSummary();
    render();
  }

  bindFilter("topicFilters", v => topic=v, "topicCount", {
    "All":"All","Google":"Google","SEO":"SEO","AI Search":"AI","Technical":"Technical"
  });
  bindFilter("sourceFilters", v => source=v, "sourceCount", {
    "All":"All","Search Engine Journal":"SEJ","Google Search Central":"GSC",
    "Search Engine Roundtable":"SER","Search Engine Land":"SEL"
  });
  bindFilter("timeFilters", v => timeRange=v, "timeCount", {
    "all":"All","24h":"24h","7d":"7d","30d":"30d"
  });

  function updateDisplayLabel(){
    const sortLabel = $("sortSelect").value === "newest" ? "Terbaru" : "Terlama";
    $("displayCount").textContent = `${sortLabel} · ${$("limitSelect").value}`;
    updateFilterSummary();
  }

  function updateFilterSummary(){
    const activeFilters = [];
    if (topic !== "All") activeFilters.push(topic);
    if (source !== "All") {
      const sourceLabels = {
        "Search Engine Journal":"SEJ","Google Search Central":"GSC",
        "Search Engine Roundtable":"SER","Search Engine Land":"SEL"
      };
      activeFilters.push(sourceLabels[source] || source);
    }
    if (timeRange !== "all") {
      const timeLabels = {"24h":"24h","7d":"7d","30d":"30d"};
      activeFilters.push(timeLabels[timeRange] || timeRange);
    }

    const sortLabel = $("sortSelect").value === "newest" ? "Terbaru" : "Terlama";
    const display = `${sortLabel} · ${$("limitSelect").value}`;

    if (activeFilters.length === 0) {
      $("filterSummary").textContent = display;
    } else if (activeFilters.length === 1) {
      $("filterSummary").textContent = `${activeFilters[0]} · ${display}`;
    } else {
      $("filterSummary").textContent = `${activeFilters.length} filters · ${display}`;
    }
  }

  $("searchInput").addEventListener("input", render);
  $("sortSelect").addEventListener("change", () => { updateDisplayLabel(); render(); });
  $("limitSelect").addEventListener("change", () => { updateDisplayLabel(); render(); });
  updateDisplayLabel();
  updateFilterSummary();

  $("resetFilters").addEventListener("click", resetFilters);
  $("resetFiltersBottom").addEventListener("click", resetFilters);

  document.querySelectorAll(".filter-main-content > .filter-accordion").forEach(section => {
    section.addEventListener("toggle", () => {
      if (!section.open) return;
      document.querySelectorAll(".filter-main-content > .filter-accordion").forEach(other => {
        if (other !== section) other.open = false;
      });
    });
  });

  async function load(){
    try{
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`);
      if(!res.ok) throw new Error("HTTP "+res.status);
      data = await res.json();
      render();
    }catch(e){
      $("articles").innerHTML = `<div class="empty">Gagal memuat data. Coba tekan Refresh.</div>`;
    }
  }

  $("refreshBtn").addEventListener("click", async () => {
    $("refreshBtn").disabled = true;
    $("refreshBtn").textContent = "↻ Loading...";
    await load();
    $("refreshBtn").disabled = false;
    $("refreshBtn").textContent = "↻ Refresh";
  });

  load();
})();
</script>
</body>
</html>
