<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEO Updates</title>
<meta name="description" content="SEO, Google, AI Search, Technical SEO, dan Ads updates.">
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--blue2:#eff6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.wrap{max-width:1080px;margin:auto;padding:18px 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:25px;font-weight:850}.sub{color:var(--muted);font-size:13px}
button,input,select{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:650}.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-top:16px}.search{border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0 12px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted)}.stat b{color:var(--text)}
.sources{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.source{background:#ecfdf3;color:#067647;border-radius:999px;padding:5px 9px;font-size:12px}.source.bad{background:#fef3f2;color:#b42318}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin:10px 0}.meta{color:var(--muted);font-size:12px;margin-bottom:7px}.title{font-size:18px;line-height:1.4;font-weight:760;color:var(--text);text-decoration:none}.title:hover{color:var(--blue)}.desc{color:var(--muted);margin-top:7px}.tag{display:inline-block;background:var(--blue2);color:#315ea8;border-radius:999px;padding:3px 8px;font-size:11px;margin:9px 5px 0 0}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12px;padding-bottom:35px}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.top{align-items:flex-start}.title{font-size:16px}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><div><div class="brand">SEO Updates</div><div class="sub">SEO, Google, AI Search, Technical & Ads</div></div><button id="refresh" class="primary">↻ Refresh</button></div>
<div class="toolbar"><input id="search" class="search" placeholder="Cari artikel…"><select id="sort"><option value="new">Terbaru</option><option value="old">Terlama</option></select><select id="limit"><option value="50">50</option><option value="100">100</option><option value="200">200</option></select></div>
<div class="filters"><button class="filter active" data-f="all">All</button><button class="filter" data-f="Google">Google</button><button class="filter" data-f="SEO">SEO</button><button class="filter" data-f="AI Search">AI Search</button><button class="filter" data-f="Technical">Technical</button><button class="filter" data-f="Ads">Ads</button></div>
</div></header>
<main class="wrap"><div class="stats"><div class="stat">Artikel <b id="count">0</b></div><div class="stat">Update <b id="updated">—</b></div></div><div id="sources" class="sources"></div><div id="feed"><div class="empty">Memuat…</div></div></main>
<footer class="wrap">Sumber: Search Engine Journal, Google Search Central, Search Engine Roundtable, dan Search Engine Land.</footer>
<script>
let all=[],filter="all";
const $=x=>document.getElementById(x);
const esc=s=>(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function fmt(d){let x=new Date(d);return isNaN(x)?"":x.toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function ago(d){let n=Date.now()-new Date(d).getTime();if(n<3600000)return Math.max(1,Math.round(n/60000))+" mnt lalu";if(n<86400000)return Math.round(n/3600000)+" jam lalu";return Math.round(n/86400000)+" hari lalu";}
function render(){
 let q=$("search").value.toLowerCase();
 let a=all.filter(x=>(filter=="all"||(x.tags||[]).includes(filter))&&((x.title+" "+x.description+" "+x.source).toLowerCase().includes(q)));
 a.sort((x,y)=>$("sort").value=="new"?new Date(y.date)-new Date(x.date):new Date(x.date)-new Date(y.date));
 a=a.slice(0,+$("limit").value);$("count").textContent=a.length;
 $("feed").innerHTML=a.length?a.map(x=>`<article class="item"><div class="meta"><b>${esc(x.source)}</b> · ${ago(x.date)} · ${fmt(x.date)}</div><a class="title" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>${x.description?`<div class="desc">${esc(x.description).slice(0,320)}${x.description.length>320?"…":""}</div>`:""}<div>${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></article>`).join(""):'<div class="empty">Tidak ada artikel yang cocok.</div>';
}
async function load(){
 $("feed").innerHTML='<div class="empty">Mengambil update…</div>';
 try{let r=await fetch("data.json?"+Date.now());if(!r.ok)throw Error(r.status);let d=await r.json();all=d.items||[];$("updated").textContent=fmt(d.updatedAt);$("sources").innerHTML=(d.sources||[]).map(s=>`<span class="source ${s.ok?"":"bad"}">● ${esc(s.name)} · ${s.count}</span>`).join("");render();}
 catch(e){$("feed").innerHTML='<div class="empty">Data belum tersedia. Jalankan GitHub Actions <b>Update SEO Feed</b> sekali untuk mengambil RSS.</div>';}
}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.f;render()});
$("search").oninput=render;$("sort").onchange=render;$("limit").onchange=render;$("refresh").onclick=load;load();
</script>
</body></html>
