<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEO Updates</title>
<meta name="description" content="SEO, Google, AI Search, dan Technical SEO updates.">
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--blue2:#eff6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.wrap{max-width:1080px;margin:auto;padding:18px 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:25px;font-weight:850}.sub{color:var(--muted);font-size:13px}
button,input,select{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:650}.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-top:16px}.search{border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0 12px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted)}.stat b{color:var(--text)}
.sources{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.source{background:#ecfdf3;color:#067647;border-radius:999px;padding:5px 9px;font-size:12px}.source.bad{background:#fef3f2;color:#b42318}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin:10px 0}.meta{color:var(--muted);font-size:12px;margin-bottom:7px}.title{font-size:18px;line-height:1.4;font-weight:760;color:var(--text);text-decoration:none}.title:hover{color:var(--blue)}.desc{color:var(--muted);margin-top:7px}.tag{display:inline-block;background:var(--blue2);color:#315ea8;border-radius:999px;padding:3px 8px;font-size:11px;margin:9px 5px 0 0}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12px;padding-bottom:35px}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.top{align-items:flex-start}.title{font-size:16px}}
</style>

<style>
  .filters-panel { padding: 18px 0 20px; }
  .filter-group { margin: 12px 0; }
  .filter-label { font-size: 12px; font-weight: 700; color: #667085; margin-bottom: 7px; }
  .filter-row { display:flex; flex-wrap:wrap; gap:7px; }
  .filter-row button { border:1px solid #d9dee8; background:#fff; border-radius:9px; padding:8px 11px; font-weight:600; cursor:pointer; }
  .filter-row button.active { background:#2563eb; color:#fff; border-color:#2563eb; }
  .filter-row button:hover { border-color:#2563eb; }
  .article-card { position:relative; }
  .article-meta { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .source-pill { font-weight:700; }
  .fresh-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#16a34a; margin-right:5px; }
  .read-link { display:inline-block; margin-top:12px; font-weight:700; text-decoration:none; }
  .empty-state { padding:40px 15px; text-align:center; color:#667085; }
  @media (max-width: 700px) {
    .filter-row button { padding:7px 9px; }
  }
</style>

</head>

<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>SEO Updates</h1>
        <p>SEO, Google, AI Search &amp; Technical</p>
      </div>
      <button id="refreshBtn" type="button">↻ Refresh</button>
    </header>

    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="Cari artikel..." aria-label="Cari artikel">
      <select id="sortSelect" aria-label="Urutkan">
        <option value="newest">Terbaru</option>
        <option value="oldest">Terlama</option>
      </select>
      <select id="limitSelect" aria-label="Jumlah artikel">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
      </select>
    </section>

    <section class="filters-panel">
      <div class="filter-group">
        <div class="filter-label">Topic</div>
        <div class="filter-row" id="topicFilters">
          <button class="active" data-topic="All">All</button>
          <button data-topic="Google">Google</button>
          <button data-topic="SEO">SEO</button>
          <button data-topic="AI Search">AI Search</button>
          <button data-topic="Technical">Technical</button>
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-label">Source</div>
        <div class="filter-row" id="sourceFilters">
          <button class="active" data-source="All">All Sources</button>
          <button data-source="Search Engine Journal">SEJ</button>
          <button data-source="Google Search Central">GSC</button>
          <button data-source="Search Engine Roundtable">SER</button>
          <button data-source="Search Engine Land">SEL</button>
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-label">Time</div>
        <div class="filter-row" id="timeFilters">
          <button class="active" data-time="all">All</button>
          <button data-time="24h">24 Hours</button>
          <button data-time="7d">7 Days</button>
          <button data-time="30d">30 Days</button>
        </div>
      </div>
    </section>

    <section class="stats" id="stats"></section>
    <section id="sourceSummary" class="source-summary"></section>
    <section id="articles"></section>
  </main>

<script>
(function () {
  const DATA_URL = "data.json";
  let data = { updatedAt: null, items: [], sources: [] };
  let topic = "All";
  let source = "All";
  let timeRange = "all";

  const $ = (id) => document.getElementById(id);
  const searchInput = $("searchInput");
  const sortSelect = $("sortSelect");
  const limitSelect = $("limitSelect");
  const articlesEl = $("articles");
  const statsEl = $("stats");
  const sourceSummaryEl = $("sourceSummary");

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function formatDate(value) {
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return "";
    return d.toLocaleString("id-ID", {
      day:"2-digit", month:"short", year:"numeric",
      hour:"2-digit", minute:"2-digit"
    });
  }

  function relativeTime(value) {
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return "";
    const diff = Math.max(0, Date.now() - d.getTime());
    const minutes = Math.floor(diff / 60000);
    if (minutes < 1) return "baru saja";
    if (minutes < 60) return `${minutes} menit lalu`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours} jam lalu`;
    const days = Math.floor(hours / 24);
    return `${days} hari lalu`;
  }

  function ageMs(range) {
    return ({ "24h":86400000, "7d":604800000, "30d":2592000000 }[range] || Infinity);
  }

  function matches(item) {
    const q = searchInput.value.trim().toLowerCase();
    const tags = Array.isArray(item.tags) ? item.tags : [];
    const haystack = `${item.title || ""} ${item.description || ""} ${item.source || ""} ${tags.join(" ")}`.toLowerCase();

    if (q && !haystack.includes(q)) return false;
    if (topic !== "All" && !tags.includes(topic)) return false;
    if (source !== "All" && item.source !== source) return false;

    if (timeRange !== "all") {
      const d = new Date(item.date).getTime();
      if (!Number.isFinite(d) || Date.now() - d > ageMs(timeRange)) return false;
    }
    return true;
  }

  function render() {
    let items = (data.items || []).filter(matches);
    items.sort((a,b) => {
      const da = new Date(a.date).getTime() || 0;
      const db = new Date(b.date).getTime() || 0;
      return sortSelect.value === "oldest" ? da - db : db - da;
    });

    const totalMatches = items.length;
    items = items.slice(0, Number(limitSelect.value));

    const updated = data.updatedAt ? formatDate(data.updatedAt) : "Belum tersedia";
    statsEl.innerHTML = `
      <span>Artikel <strong>${totalMatches}</strong></span>
      <span>Updated <strong>${escapeHtml(updated)}</strong></span>
    `;

    const counts = {};
    for (const item of items) counts[item.source] = (counts[item.source] || 0) + 1;
    sourceSummaryEl.innerHTML = Object.entries(counts).map(([name,count]) =>
      `<span>• ${escapeHtml(name)} · ${count}</span>`
    ).join("");

    if (!items.length) {
      articlesEl.innerHTML = `<div class="empty-state">Tidak ada artikel yang cocok dengan filter.</div>`;
      return;
    }

    articlesEl.innerHTML = items.map(item => {
      const tags = (item.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      const title = escapeHtml(item.title || "Untitled");
      const description = escapeHtml(item.description || "");
      const link = escapeHtml(item.link || "#");
      const sourceName = escapeHtml(item.source || "Unknown");
      const date = formatDate(item.date);
      const rel = relativeTime(item.date);

      return `
        <article class="article-card">
          <div class="article-meta">
            <span class="source-pill">${sourceName}</span>
            <span>• ${escapeHtml(rel)}</span>
            <span>• ${escapeHtml(date)}</span>
          </div>
          <h2><a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a></h2>
          ${description ? `<p>${description}</p>` : ""}
          <div class="tags">${tags}</div>
          <a class="read-link" href="${link}" target="_blank" rel="noopener noreferrer">Read article →</a>
        </article>
      `;
    }).join("");
  }

  function setActive(containerId, attr, value) {
    document.querySelectorAll(`#${containerId} button`).forEach(btn => {
      btn.classList.toggle("active", btn.dataset[attr] === value);
    });
  }

  document.querySelectorAll("#topicFilters button").forEach(btn => {
    btn.addEventListener("click", () => {
      topic = btn.dataset.topic;
      setActive("topicFilters", "topic", topic);
      render();
    });
  });

  document.querySelectorAll("#sourceFilters button").forEach(btn => {
    btn.addEventListener("click", () => {
      source = btn.dataset.source;
      setActive("sourceFilters", "source", source);
      render();
    });
  });

  document.querySelectorAll("#timeFilters button").forEach(btn => {
    btn.addEventListener("click", () => {
      timeRange = btn.dataset.time;
      setActive("timeFilters", "time", timeRange);
      render();
    });
  });

  searchInput.addEventListener("input", render);
  sortSelect.addEventListener("change", render);
  limitSelect.addEventListener("change", render);

  $("refreshBtn").addEventListener("click", async () => {
    $("refreshBtn").disabled = true;
    $("refreshBtn").textContent = "↻ Loading...";
    await load(true);
    $("refreshBtn").disabled = false;
    $("refreshBtn").textContent = "↻ Refresh";
  });

  async function load(forceBust) {
    try {
      const url = `${DATA_URL}?t=${forceBust ? Date.now() : Math.floor(Date.now()/60000)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
      render();
    } catch (err) {
      articlesEl.innerHTML = `<div class="empty-state">Gagal memuat data. Coba Refresh lagi.</div>`;
    }
  }

  load(false);
})();
</script>
</body>

</html>
