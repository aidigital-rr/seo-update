<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Updates</title>
<style>
:root{
  --bg:#f4f6fa;
  --surface:#fff;
  --surface-soft:#f8fafc;
  --border:#e4e8ef;
  --border-strong:#d6dce6;
  --text:#172033;
  --muted:#667085;
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --primary-soft:#eef4ff;
  --green:#047857;
  --green-soft:#ecfdf5;
  --shadow:0 1px 2px rgba(16,24,40,.03),0 5px 18px rgba(16,24,40,.035);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;
}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.container{
  width:min(1160px,calc(100% - 40px));
  margin:0 auto;
  padding:38px 0 64px;
}

/* Header — deliberately NOT sticky */
.header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  margin-bottom:24px;
}
.brand h1{
  margin:0;
  font-size:30px;
  line-height:1.1;
  letter-spacing:-.8px;
  font-weight:800;
}
.brand p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:14px;
}
.refresh{
  border:1px solid var(--primary);
  background:var(--primary);
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-size:13px;
  font-weight:750;
  box-shadow:0 2px 5px rgba(37,99,235,.18);
  transition:.15s ease;
}
.refresh:hover{background:var(--primary-dark);transform:translateY(-1px)}
.refresh:disabled{opacity:.65;cursor:wait;transform:none}

/* Search / controls */
.search-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 130px 92px;
  gap:9px;
  margin-bottom:14px;
}
.search{
  width:100%;
  height:44px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  color:var(--text);
  outline:none;
  box-shadow:var(--shadow);
  transition:.15s ease;
}
.search::placeholder{color:#98a2b3}
.search:focus{
  border-color:#9ab8f7;
  box-shadow:0 0 0 3px #e3edff;
}
.select{
  height:44px;
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  padding:0 11px;
  color:#344054;
  outline:none;
}
.select:focus{border-color:#9ab8f7}

/* Filter panel — normal flow, never sticky */
.filters{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px 17px 14px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}
.filter-group{
  display:flex;
  align-items:flex-start;
  gap:16px;
}
.filter-group+.filter-group{
  margin-top:11px;
  padding-top:11px;
  border-top:1px solid #f0f2f5;
}
.filter-label{
  flex:0 0 55px;
  padding-top:7px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:800;
  color:#7b8494;
}
.filter-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.filter{
  border:1px solid var(--border);
  background:#fff;
  color:#475467;
  padding:6px 11px;
  border-radius:7px;
  font-size:12px;
  font-weight:650;
  transition:.12s ease;
}
.filter:hover{
  border-color:#b8c5dc;
  background:#fafbfc;
}
.filter.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
  box-shadow:0 1px 3px rgba(37,99,235,.16);
}

/* Results summary */
.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 9px;
}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:7px;
  padding:6px 10px;
  font-size:11px;
  color:var(--muted);
}
.stat strong{color:var(--text);font-weight:800}
.source-summary{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:11px;
}
.source-summary span{
  color:var(--green);
  background:var(--green-soft);
  border:1px solid #d5f4e6;
  border-radius:999px;
  padding:3px 8px;
  font-size:10px;
  font-weight:700;
}

/* Article cards */
#articles{display:grid;gap:9px}
.article-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:11px;
  padding:15px 17px 13px;
  box-shadow:var(--shadow);
  transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease;
}
.article-card:hover{
  border-color:#d6deeb;
  box-shadow:0 4px 18px rgba(16,24,40,.06);
  transform:translateY(-1px);
}
.article-top{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
  color:var(--muted);
  font-size:10px;
  margin-bottom:6px;
}
.source-name{font-weight:800;color:#53627a}
.dot{color:#b8c0cc}
.title{
  margin:0 0 5px;
  font-size:16px;
  line-height:1.32;
  letter-spacing:-.15px;
  font-weight:750;
}
.title a{text-decoration:none}
.title a:hover{color:var(--primary)}
.description{
  margin:0;
  color:#667085;
  font-size:12.5px;
  line-height:1.55;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.card-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:10px;
}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{
  background:var(--primary-soft);
  color:#315da8;
  border:1px solid #e0eaff;
  border-radius:999px;
  padding:2px 7px;
  font-size:9px;
  font-weight:750;
}
.read{
  flex:0 0 auto;
  color:var(--primary);
  text-decoration:none;
  font-size:11px;
  font-weight:800;
}
.read:hover{text-decoration:underline}
.empty{
  background:var(--surface);
  border:1px dashed var(--border-strong);
  border-radius:11px;
  padding:42px 20px;
  text-align:center;
  color:var(--muted);
}
.loading{text-align:center;color:var(--muted);padding:42px}

/* Responsive */
@media(max-width:760px){
  .container{width:min(100% - 28px,1160px);padding:24px 0 44px}
  .header{align-items:flex-start}
  .brand h1{font-size:26px}
  .search-row{grid-template-columns:minmax(0,1fr) 110px}
  .search-row .select:last-child{grid-column:2}
  .filter-group{display:block}
  .filter-label{padding:0;margin-bottom:6px}
  .filter-group+.filter-group{margin-top:12px;padding-top:12px}
}
@media(max-width:500px){
  .header{flex-direction:column;gap:14px}
  .refresh{width:100%}
  .search-row{grid-template-columns:1fr}
  .search-row .select:last-child{grid-column:auto}
  .filter{padding:6px 9px}
  .article-card{padding:14px}
  .card-bottom{align-items:flex-start;flex-direction:column}
  .read{align-self:flex-end}
}
</style>
</head>
<body>
<main class="container">
  <header class="header">
    <div class="brand">
      <h1>SEO Updates</h1>
      <p>SEO, Google, AI Search &amp; Technical</p>
    </div>
    <button class="refresh" id="refreshBtn">↻ Refresh</button>
  </header>

  <section class="search-row">
    <div class="search-wrap">
      <input class="search" id="searchInput" type="search" placeholder="Cari artikel..." aria-label="Cari artikel">
    </div>
    <select class="select" id="sortSelect" aria-label="Urutan">
      <option value="newest">Terbaru</option>
      <option value="oldest">Terlama</option>
    </select>
    <select class="select" id="limitSelect" aria-label="Jumlah artikel">
      <option value="25">25</option>
      <option value="50" selected>50</option>
      <option value="100">100</option>
    </select>
  </section>

  <section class="filters">
    <div class="filter-group">
      <div class="filter-label">Topic</div>
      <div class="filter-row" id="topicFilters">
        <button class="filter active" data-value="All">All</button>
        <button class="filter" data-value="Google">Google</button>
        <button class="filter" data-value="SEO">SEO</button>
        <button class="filter" data-value="AI Search">AI Search</button>
        <button class="filter" data-value="Technical">Technical</button>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">Source</div>
      <div class="filter-row" id="sourceFilters">
        <button class="filter active" data-value="All">All Sources</button>
        <button class="filter" data-value="Search Engine Journal">SEJ</button>
        <button class="filter" data-value="Google Search Central">GSC</button>
        <button class="filter" data-value="Search Engine Roundtable">SER</button>
        <button class="filter" data-value="Search Engine Land">SEL</button>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">Time</div>
      <div class="filter-row" id="timeFilters">
        <button class="filter active" data-value="all">All</button>
        <button class="filter" data-value="24h">24 Hours</button>
        <button class="filter" data-value="7d">7 Days</button>
        <button class="filter" data-value="30d">30 Days</button>
      </div>
    </div>
  </section>

  <div class="meta-row">
    <div class="stats" id="stats"></div>
  </div>
  <div class="source-summary" id="sourceSummary"></div>
  <section id="articles"><div class="loading">Memuat artikel...</div></section>
</main>

<script>
(() => {
  const DATA_URL = "data.json";
  let data = {updatedAt:null,items:[]};
  let topic = "All", source = "All", timeRange = "all";

  const $ = id => document.getElementById(id);

  function escapeHtml(v){
    return String(v ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function dateObj(v){
    const d = new Date(v);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function formatDate(v){
    const d = dateObj(v);
    if(!d) return "";
    return d.toLocaleString("id-ID", {
      day:"2-digit", month:"short", year:"numeric",
      hour:"2-digit", minute:"2-digit"
    });
  }

  function relativeTime(v){
    const d = dateObj(v);
    if(!d) return "";
    const mins = Math.max(0, Math.floor((Date.now()-d.getTime())/60000));
    if(mins < 1) return "baru saja";
    if(mins < 60) return `${mins} menit lalu`;
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return `${hrs} jam lalu`;
    const days = Math.floor(hrs/24);
    if(days < 30) return `${days} hari lalu`;
    return formatDate(v);
  }

  function matches(item){
    const q = $("searchInput").value.trim().toLowerCase();
    const tags = Array.isArray(item.tags) ? item.tags : [];
    const hay = `${item.title||""} ${item.description||""} ${item.source||""} ${tags.join(" ")}`.toLowerCase();

    if(q && !hay.includes(q)) return false;
    if(topic !== "All" && !tags.includes(topic)) return false;
    if(source !== "All" && item.source !== source) return false;

    if(timeRange !== "all"){
      const d = dateObj(item.date);
      if(!d) return false;
      const limit = { "24h":86400000, "7d":604800000, "30d":2592000000 }[timeRange];
      if(Date.now()-d.getTime() > limit) return false;
    }
    return true;
  }

  function render(){
    let items = (data.items || []).filter(matches);
    items.sort((a,b) => {
      const da = dateObj(a.date)?.getTime() || 0;
      const db = dateObj(b.date)?.getTime() || 0;
      return $("sortSelect").value === "oldest" ? da-db : db-da;
    });

    const total = items.length;
    items = items.slice(0, Number($("limitSelect").value));

    const updated = data.updatedAt ? formatDate(data.updatedAt) : "Belum tersedia";
    $("stats").innerHTML =
      `<div class="stat">Artikel <strong>${total}</strong></div>
       <div class="stat">Update <strong>${escapeHtml(updated)}</strong></div>`;

    const counts = {};
    items.forEach(i => counts[i.source] = (counts[i.source]||0)+1);
    $("sourceSummary").innerHTML = Object.entries(counts).map(([n,c]) =>
      `<span>• ${escapeHtml(n)} · ${c}</span>`
    ).join("");

    if(!items.length){
      $("articles").innerHTML = `<div class="empty">Tidak ada artikel yang sesuai dengan filter.</div>`;
      return;
    }

    $("articles").innerHTML = items.map(item => {
      const link = escapeHtml(item.link || "#");
      const tags = (item.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      return `
        <article class="article-card">
          <div class="article-top">
            <span class="source-name">${escapeHtml(item.source || "Unknown")}</span>
            <span class="dot">•</span>
            <span>${escapeHtml(relativeTime(item.date))}</span>
            <span class="dot">•</span>
            <span>${escapeHtml(formatDate(item.date))}</span>
          </div>
          <h2 class="title">
            <a href="${link}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || "Untitled")}</a>
          </h2>
          ${item.description ? `<p class="description">${escapeHtml(item.description)}</p>` : ""}
          <div class="card-bottom">
            <div class="tags">${tags}</div>
            <a class="read" href="${link}" target="_blank" rel="noopener noreferrer">Read article →</a>
          </div>
        </article>`;
    }).join("");
  }

  function bindFilter(groupId, setter){
    document.querySelectorAll(`#${groupId} .filter`).forEach(btn => {
      btn.addEventListener("click", () => {
        setter(btn.dataset.value);
        document.querySelectorAll(`#${groupId} .filter`).forEach(b =>
          b.classList.toggle("active", b === btn)
        );
        render();
      });
    });
  }

  bindFilter("topicFilters", v => topic=v);
  bindFilter("sourceFilters", v => source=v);
  bindFilter("timeFilters", v => timeRange=v);

  $("searchInput").addEventListener("input", render);
  $("sortSelect").addEventListener("change", render);
  $("limitSelect").addEventListener("change", render);

  async function load(){
    try{
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`);
      if(!res.ok) throw new Error("HTTP "+res.status);
      data = await res.json();
      render();
    }catch(e){
      $("articles").innerHTML = `<div class="empty">Gagal memuat data. Coba tekan Refresh.</div>`;
    }
  }

  $("refreshBtn").addEventListener("click", async () => {
    $("refreshBtn").disabled = true;
    $("refreshBtn").textContent = "↻ Loading...";
    await load();
    $("refreshBtn").disabled = false;
    $("refreshBtn").textContent = "↻ Refresh";
  });

  load();
})();
</script>
</body>
</html>
